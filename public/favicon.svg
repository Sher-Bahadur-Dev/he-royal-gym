<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0c0d12"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Central athletic dumbbell emblem with red and white -->
