  <line x1="28" y1="30.5" x2="28" y2="33.5" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="30.5" x2="32" y2="33.5" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="30.5" x2="36" y2="33.5" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Inner large plates (Performance Red) -->
